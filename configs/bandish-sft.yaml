# Bandish composer, step 1: words and notes together. Starts from the v6 composer (it knows the
# 13 ragas); learns the Bhatkhande layout and to set words: public-domain Braj verse set on
# real-singer melodies (scripts/build_bandish.py), 90% of verses (by page), 10% held out.
name: bandish-sft
model: mlx-community/Qwen3-0.6B-bf16
tracker: trackio
init_adapter: null        # set by scripts/run_bandish.sh to the v6 composer's best checkpoint
ragas: [bhupali, yaman, malkauns, deshkar, bhairav, todi, shuddh_sarang, madhuvanti, marwa, bihag, darbari, miyan_malhar, basant]
reward_style: v6
target_bars: 16

sft_epochs: 3
sft_data: data/bandish_v1.jsonl
prompts_per_step: 4
group_size: 4            # batch 16
lr: 5.0e-5
warmup_steps: 10
beta: 0.0
lora_rank: 16
lora_layers: 16
max_tokens: 420          # teaching bandishes: median 280, max 333 tokens

eval_every: 60
eval_samples: 3          # per raga per task: 13 × 3 × 2 = 78 bandishes per evaluation
save_every: 60
best_metric: eval/both/reward
render_audio: false
micro_batch: 2
gen_batch: 12
memory_gb: 6
hard_memory_gb: 9
min_free_gb: 2.5
governor_full_gb: 4.0
governor_pause_gb: 3.0
